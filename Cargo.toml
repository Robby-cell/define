[package]
name = "define"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "def"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rodio = { version = "0.22.2", features = ["playback", "mp3", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
